<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Speculative messaging on JAM · walkthrough</title>
	<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<main>
<svg id="scene" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid meet">
	<!-- Motion paths. Invisible; tokens travel along them. -->
	<g id="paths" fill="none" stroke="none">
		<path id="pA1" d="M434,70 C434,220 290,250 290,395" />
		<path id="pA2" d="M290,395 C290,500 580,480 580,560" />
		<path id="pA3" d="M580,560 L580,660" />
		<path id="pA4" d="M580,660 C420,560 100,530 80,612" />
		<path id="pB1" d="M1054,70 C1054,220 910,250 910,395" />
		<path id="pB2" d="M910,395 C910,500 580,480 580,560" />
		<path id="pB3" d="M580,560 L580,660" />
		<path id="pB4" d="M580,660 C740,560 860,530 880,612" />
		<path id="pReq" d="M530,383 L670,383" />
		<path id="pResp" d="M655,410 L545,410" />
		<path id="pInh" d="M290,395 L290,335" />
		<path id="pTx1" d="M1100,395 L910,395" />
		<path id="pTx2" d="M910,395 L910,335" />
		<path id="pA5" d="M580,660 C420,560 144,530 124,612" />
		<path id="pB5" d="M580,660 C740,560 904,530 924,612" />
		<path id="pMReq" d="M670,383 L530,383" />
		<path id="pMResp" d="M545,410 L655,410" />
	</g>

	<!-- ───────────── Parachain A ─────────────
	     Same template in both boxes: header with StreamsRoot, then one
	     "Channel A→B" section whose rows are the channel's two streams. -->
	<g id="chainA" class="chain a">
		<rect class="box" x="30" y="30" width="520" height="280" rx="14" />
		<text class="title" x="50" y="64">Parachain A</text>
		<text class="sub" x="186" y="64">sender</text>
		<g id="a-block" class="pill amber" transform="translate(500,30)" style="opacity:0">
			<rect x="-31" y="-11" width="62" height="22" rx="11" />
			<text y="4" text-anchor="middle">block N</text>
		</g>
		<g id="a-block-ok" class="pill green" transform="translate(500,30)" style="opacity:0">
			<rect x="-32" y="-11" width="64" height="22" rx="11" />
			<text class="tight" y="4" text-anchor="middle">block N ✓</text>
		</g>

		<text class="label" x="388" y="62" text-anchor="end">StreamsRoot</text>
		<g transform="translate(434,57)">
			<g id="a-root-pill" class="pill root">
				<rect x="-36" y="-13" width="72" height="26" rx="13" />
				<text id="a-root-0" class="mono dim" text-anchor="middle" y="5">—</text>
				<text id="a-root-1" class="mono" text-anchor="middle" y="5" style="opacity:0">T<tspan class="subs" dy="3">A1</tspan></text>
				<text id="a-root-2" class="mono" text-anchor="middle" y="5" style="opacity:0">T<tspan class="subs" dy="3">A2</tspan></text>
			</g>
		</g>
		<text id="a-digest" class="caption-s" x="434" y="84" text-anchor="middle" style="opacity:0">in header digest</text>

		<text class="ch-title" x="50" y="104">Channel A→B<tspan class="ch-tag" dx="12">domain 0 · num 0</tspan></text>
		<g id="a-phase-opening" style="opacity:0">
			<g class="pill amber" transform="translate(350,100)">
				<rect x="-42" y="-11" width="84" height="22" rx="11" />
				<text y="4" text-anchor="middle">Opening</text>
			</g>
		</g>
		<g id="a-phase-open" style="opacity:0">
			<g class="pill green" transform="translate(350,100)">
				<rect x="-42" y="-11" width="84" height="22" rx="11" />
				<text y="4" text-anchor="middle">Open</text>
			</g>
		</g>

		<!-- data row: A writes -->
		<text class="row-label" x="50" y="143">writes</text>
		<g class="chip data"><rect x="92" y="129" width="44" height="20" rx="10" /><text x="114" y="143" text-anchor="middle">data</text></g>
		<g class="slots">
			<rect x="150" y="118" width="48" height="40" rx="6" />
			<rect x="204" y="118" width="48" height="40" rx="6" />
			<rect x="258" y="118" width="48" height="40" rx="6" />
			<rect x="312" y="118" width="48" height="40" rx="6" />
			<rect x="366" y="118" width="48" height="40" rx="6" />
			<rect x="420" y="118" width="48" height="40" rx="6" />
		</g>
		<g id="a-leaf0" class="leaf" style="opacity:0">
			<rect x="150" y="118" width="48" height="40" rx="6" />
			<text x="174" y="143" text-anchor="middle">OpenCh</text>
		</g>
		<g id="a-leaf1" class="leaf pending" style="opacity:0">
			<rect x="204" y="118" width="48" height="40" rx="6" />
			<text x="228" y="143" text-anchor="middle">m₁</text>
		</g>
		<g id="a-leaf2" class="leaf pending" style="opacity:0">
			<rect x="258" y="118" width="48" height="40" rx="6" />
			<text x="282" y="143" text-anchor="middle">m₂</text>
		</g>
		<g id="a-split" style="opacity:0">
			<line class="split" x1="152" y1="165" x2="196" y2="165" />
			<text class="split-label" x="174" y="179" text-anchor="middle">frontier</text>
			<line class="split pending" x1="206" y1="165" x2="304" y2="165" />
			<text class="split-label" x="255" y="179" text-anchor="middle">this block</text>
		</g>
		<path id="a-fold" class="fold" d="M472,138 C500,138 500,90 470,64" />

		<!-- ack row: A reads -->
		<text class="row-label" x="50" y="203">reads</text>
		<g class="chip ack"><rect x="92" y="189" width="44" height="20" rx="10" /><text x="114" y="203" text-anchor="middle">ack</text></g>
		<text id="a-ack-none" class="mono dim" x="150" y="203">—</text>
		<g id="a-ack-reg" style="opacity:0">
			<text id="a-ack-reg-l1" class="mono" x="150" y="203">Register #0 ✓  up_to 0</text>
			<text id="a-req-line" class="mono small dim" x="150" y="225">→ requires (B, T<tspan class="subs" dy="3">B1</tspan><tspan dy="-3">) via host fn 205</tspan></text>
		</g>

		<!-- Stage 1: credit gauge and the block's send calls -->
		<g id="a-credit" style="opacity:0">
			<text class="mono small dim" x="150" y="228">in flight</text>
			<rect class="credit-bg" x="222" y="221" width="120" height="8" rx="4" />
			<rect id="a-credit-fill" class="credit-fill" x="222" y="221" width="7.5" height="8" rx="4" />
			<text id="a-cr-1" class="mono small" x="352" y="228">1 / 16 msg</text>
			<text id="a-cr-2" class="mono small" x="352" y="228" style="opacity:0">2 / 16 msg</text>
			<text id="a-cr-3" class="mono small" x="352" y="228" style="opacity:0">3 / 16 msg</text>
			<text id="a-cr-0" class="mono small" x="352" y="228" style="opacity:0">0 / 16 msg</text>
		</g>
		<!-- Stage 6: B's second register, read under T_B2 -->
		<text id="a-ack-reg2" class="mono" x="150" y="203" style="opacity:0">Register #1 ✓  up_to 3</text>
		<text id="a-req2" class="mono small dim" x="150" y="252" style="opacity:0">→ requires (B, T<tspan class="subs" dy="3">B2</tspan><tspan dy="-3">) via host fn 205</tspan></text>
		<g id="a-leaf1s" class="leaf" style="opacity:0">
			<rect x="204" y="118" width="48" height="40" rx="6" />
			<text class="msg-leaf" x="228" y="143" text-anchor="middle">m₁</text>
		</g>
		<g id="a-leaf2s" class="leaf" style="opacity:0">
			<rect x="258" y="118" width="48" height="40" rx="6" />
			<text class="msg-leaf" x="282" y="143" text-anchor="middle">m₂</text>
		</g>
		<text id="send-log1" class="send-log" x="150" y="288" style="opacity:0">send(B, 0, 0, m₁) ✓</text>
		<text id="send-log2" class="send-log" x="300" y="288" style="opacity:0">send(B, 0, 0, m₂) ✓</text>
	</g>

	<!-- ───────────── Parachain B ───────────── -->
	<g id="chainB" class="chain b">
		<rect class="box" x="650" y="30" width="520" height="280" rx="14" />
		<text class="title" x="670" y="64">Parachain B</text>
		<text class="sub" x="806" y="64">receiver</text>
		<g id="b-block" class="pill amber" transform="translate(1120,30)" style="opacity:0">
			<rect x="-31" y="-11" width="62" height="22" rx="11" />
			<text y="4" text-anchor="middle">block M</text>
		</g>
		<g id="b-block-ok" class="pill green" transform="translate(1120,30)" style="opacity:0">
			<rect x="-32" y="-11" width="64" height="22" rx="11" />
			<text class="tight" y="4" text-anchor="middle">block M ✓</text>
		</g>

		<text class="label" x="1008" y="62" text-anchor="end">StreamsRoot</text>
		<g transform="translate(1054,57)">
			<g id="b-root-pill" class="pill root">
				<rect x="-36" y="-13" width="72" height="26" rx="13" />
				<text id="b-root-0" class="mono dim" text-anchor="middle" y="5">—</text>
				<text id="b-root-1" class="mono" text-anchor="middle" y="5" style="opacity:0">T<tspan class="subs" dy="3">B1</tspan></text>
				<text id="b-root-2" class="mono" text-anchor="middle" y="5" style="opacity:0">T<tspan class="subs" dy="3">B2</tspan></text>
			</g>
		</g>

		<text id="b-empty" class="hint" x="910" y="178" text-anchor="middle">no state for A · an unaccepted open costs B nothing</text>

		<g id="b-channel" style="opacity:0">
			<text class="ch-title" x="670" y="104">Channel A→B<tspan class="ch-tag" dx="12">domain 0 · num 0</tspan></text>
			<g class="pill green" transform="translate(960,100)">
				<rect x="-42" y="-11" width="84" height="22" rx="11" />
				<text y="4" text-anchor="middle">Accepted</text>
			</g>

			<!-- data row: B reads -->
			<text class="row-label" x="670" y="143">reads</text>
			<g class="chip data"><rect x="712" y="129" width="44" height="20" rx="10" /><text x="734" y="143" text-anchor="middle">data</text></g>
			<g class="slots">
				<rect x="770" y="118" width="48" height="40" rx="6" />
				<rect x="824" y="118" width="48" height="40" rx="6" />
				<rect x="878" y="118" width="48" height="40" rx="6" />
				<rect x="932" y="118" width="48" height="40" rx="6" />
				<rect x="986" y="118" width="48" height="40" rx="6" />
				<rect x="1040" y="118" width="48" height="40" rx="6" />
			</g>
			<text id="b-front-0" class="split-label" x="770" y="174">InboundFrontier · leaf_count 0 (A's data stream)</text>

			<!-- ack row: B writes -->
			<text class="row-label" x="670" y="203">writes</text>
			<g class="chip ack"><rect x="712" y="189" width="44" height="20" rx="10" /><text x="734" y="203" text-anchor="middle">ack</text></g>
			<g class="slots">
				<rect x="770" y="180" width="48" height="40" rx="6" />
				<rect x="824" y="180" width="48" height="40" rx="6" />
				<rect x="878" y="180" width="48" height="40" rx="6" />
				<rect x="932" y="180" width="48" height="40" rx="6" />
				<rect x="986" y="180" width="48" height="40" rx="6" />
				<rect x="1040" y="180" width="48" height="40" rx="6" />
			</g>
		</g>
		<g id="b-leaf0" class="leaf" style="opacity:0">
			<rect x="770" y="180" width="48" height="40" rx="6" />
			<text x="794" y="205" text-anchor="middle">Reg</text>
		</g>
		<text id="b-leaf0-detail" class="detail mono" x="770" y="242" style="opacity:0">#0 Register · up_to 0 · grant 16 msg / 64 KiB</text>
		<text id="b-leaf1-detail" class="detail mono" x="770" y="242" style="opacity:0">#1 Register · up_to 3 · grant 16 msg / 64 KiB</text>
		<g id="b-leaf1" class="leaf" style="opacity:0">
			<rect x="824" y="180" width="48" height="40" rx="6" />
			<text x="848" y="205" text-anchor="middle">Reg′</text>
		</g>
		<!-- Stage 4: A's messages consumed into B's inbound frontier -->
		<g id="b-in0" class="leaf acopy" style="opacity:0"><rect x="770" y="118" width="48" height="40" rx="6" /><text x="794" y="143" text-anchor="middle">OpenCh</text></g>
		<g id="b-in1" class="leaf acopy" style="opacity:0"><rect x="824" y="118" width="48" height="40" rx="6" /><text class="msg-leaf" x="848" y="143" text-anchor="middle">m₁</text></g>
		<g id="b-in2" class="leaf acopy" style="opacity:0"><rect x="878" y="118" width="48" height="40" rx="6" /><text class="msg-leaf" x="902" y="143" text-anchor="middle">m₂</text></g>
		<text id="b-front-3" class="split-label" x="770" y="174" style="opacity:0">InboundFrontier · leaf_count 3 (A's data stream)</text>
		<g id="b-record" style="opacity:0">
			<text class="label" x="670" y="274">Consumption record · block M</text>
			<text class="mono small" x="670" y="294">A · data stream: start root(∅) → end frontier(3)</text>
		</g>
		<path id="b-fold" class="fold" d="M1092,200 C1130,200 1130,90 1090,64" />
	</g>

	<!-- JAM frame, off-chain band, then route trails (cloned from the motion
	     paths by main.js). All sit below collators and JAM nodes, so those
	     boxes hide the parts of a trail that pass through them. -->
	<g id="jam-frame" class="chain jam">
		<rect class="box" x="30" y="480" width="1140" height="310" rx="14" />
	</g>
	<g id="offchain-band">
		<rect class="band" x="140" y="316" width="920" height="160" rx="12" />
		<text class="band-label" x="1046" y="466" text-anchor="end">OFF-CHAIN</text>
	</g>
	<rect id="offchain-band-hi" class="band-hi" x="140" y="316" width="920" height="160" rx="12" style="opacity:0" />
	<g id="trails"></g>

	<!-- ───────────── Collators (off-chain) ───────────── -->
	<g id="colA" class="node-g a">
		<rect class="node" x="150" y="360" width="280" height="92" rx="10" />
		<text class="title-s" x="290" y="388" text-anchor="middle">A collator</text>
		<!-- node-local archive of A's sends, by position on the data stream -->
		<text id="a-archive" class="archive-label" x="168" y="415" style="opacity:0">archive · data</text>
		<g id="arc-a0" class="archive-chip" style="opacity:0"><rect x="246" y="402" width="40" height="18" rx="4" /><text x="266" y="415" text-anchor="middle">OpenCh</text></g>
		<g id="arc-a1" class="archive-chip" style="opacity:0"><rect x="290" y="402" width="40" height="18" rx="4" /><text x="310" y="416" text-anchor="middle" class="msg">m₁</text></g>
		<g id="arc-a2" class="archive-chip" style="opacity:0"><rect x="334" y="402" width="40" height="18" rx="4" /><text x="354" y="416" text-anchor="middle" class="msg">m₂</text></g>
		<text id="arc-a-pruned" class="archive-note" x="246" y="415" style="opacity:0">pruned #0–#2 (below up_to 3)</text>
		<!-- peer data this collator fetched and verified, staged for its next inherent -->
		<text id="a-fetched" class="archive-label" x="168" y="439" style="opacity:0">fetched · ack</text>
		<g id="fet-a0" class="archive-chip b" style="opacity:0"><rect x="246" y="426" width="40" height="18" rx="4" /><text x="266" y="439" text-anchor="middle">Reg</text></g>
		<text id="fet-a0-ok" class="fetch-ok" x="292" y="439" style="opacity:0">✓ T<tspan class="subs" dy="3">B1</tspan></text>
		<g id="fet-a1" class="archive-chip b" style="opacity:0"><rect x="246" y="426" width="40" height="18" rx="4" /><text x="266" y="439" text-anchor="middle">Reg′</text></g>
		<text id="fet-a1-ok" class="fetch-ok" x="292" y="439" style="opacity:0">✓ T<tspan class="subs" dy="3">B2</tspan></text>
	</g>
	<g id="colB" class="node-g b">
		<rect class="node" x="770" y="360" width="280" height="92" rx="10" />
		<text class="title-s" x="910" y="388" text-anchor="middle">B collator</text>
		<text id="b-archive" class="archive-label" x="788" y="415" style="opacity:0">archive · ack</text>
		<g id="arc-b0" class="archive-chip b" style="opacity:0"><rect x="866" y="402" width="40" height="18" rx="4" /><text x="886" y="415" text-anchor="middle">Reg</text></g>
		<g id="arc-b1" class="archive-chip b" style="opacity:0"><rect x="910" y="402" width="40" height="18" rx="4" /><text x="930" y="415" text-anchor="middle">Reg′</text></g>
		<text id="b-fetched" class="archive-label" x="788" y="439" style="opacity:0">fetched · data</text>
		<g id="fet-b0" class="archive-chip" style="opacity:0"><rect x="866" y="426" width="40" height="18" rx="4" /><text x="886" y="439" text-anchor="middle">OpenCh</text></g>
		<g id="fet-b1" class="archive-chip" style="opacity:0"><rect x="910" y="426" width="40" height="18" rx="4" /><text x="930" y="440" text-anchor="middle" class="msg">m₁</text></g>
		<g id="fet-b2" class="archive-chip" style="opacity:0"><rect x="954" y="426" width="40" height="18" rx="4" /><text x="974" y="440" text-anchor="middle" class="msg">m₂</text></g>
		<text id="fet-b-ok" class="fetch-ok" x="1000" y="439" style="opacity:0">✓ T<tspan class="subs" dy="3">A2</tspan></text>
	</g>
	<!-- Whoever signs accept_open_channel on B's side -->
	<g id="user" class="actor" style="opacity:0">
		<circle cx="1115" cy="383" r="8" />
		<path d="M1101,407 a14,12 0 0 1 28,0 z" />
		<text x="1115" y="424" text-anchor="middle">user</text>
	</g>

	<!-- ───────────── JAM chain ───────────── -->
	<g id="jam" class="chain jam">
		<text class="title" x="50" y="514">JAM chain</text>
		<text class="sub" x="160" y="514">Parachain Service · stores 32-byte roots only</text>

		<g id="refine" class="node-g">
			<rect class="node" x="480" y="530" width="200" height="60" rx="10" />
			<text class="title-s" x="580" y="556" text-anchor="middle">Refine</text>
			<text class="sub" x="580" y="576" text-anchor="middle">host fn 204 → streams_root</text>
		</g>
		<line class="flow" x1="580" y1="590" x2="580" y2="630" />
		<text class="hint" x="572" y="614" text-anchor="end">work digest</text>
		<g id="accumulate" class="node-g">
			<rect class="node" x="480" y="630" width="200" height="60" rx="10" />
			<text class="title-s" x="580" y="656" text-anchor="middle">Accumulate</text>
			<text class="sub" x="580" y="676" text-anchor="middle">settle · push into ring</text>
		</g>

		<!-- Stage 2: what sits at Refine / Accumulate for block N -->
		<g id="refine-wp" class="pill amber" transform="translate(760,560)" style="opacity:0">
			<rect x="-58" y="-11" width="116" height="22" rx="11" />
			<text y="4" text-anchor="middle">WP · block N</text>
		</g>
		<g id="join-badges" class="ok" style="opacity:0">
			<text x="592" y="606">✓ guaranteed</text>
			<text x="592" y="623">✓ available</text>
		</g>
		<g id="acc-digest" class="pill blue" transform="translate(760,660)" style="opacity:0">
			<rect x="-58" y="-11" width="116" height="22" rx="11" />
			<text class="mono" y="4" text-anchor="middle">digest · T<tspan class="subs" dy="3">A2</tspan></text>
		</g>

		<g id="refine-wpB" class="pill amber" transform="translate(760,560)" style="opacity:0">
			<rect x="-58" y="-11" width="116" height="22" rx="11" />
			<text y="4" text-anchor="middle">WP · block M</text>
		</g>
		<g id="acc-digestB" class="pill blue" transform="translate(580,714)" style="opacity:0">
			<rect x="-100" y="-11" width="200" height="22" rx="11" />
			<text class="mono" y="4" text-anchor="middle">digest · requires (A, T<tspan class="subs" dy="3">A2</tspan><tspan dy="-3"></tspan>)</text>
		</g>

		<!-- settlement ring A; the caret marks the next free slot -->
		<g class="slots">
			<rect x="60" y="592" width="40" height="40" rx="6" />
			<rect x="104" y="592" width="40" height="40" rx="6" />
			<rect x="148" y="592" width="40" height="40" rx="6" />
			<rect x="192" y="592" width="40" height="40" rx="6" />
			<rect x="236" y="592" width="40" height="40" rx="6" />
			<rect x="280" y="592" width="40" height="40" rx="6" />
		</g>
		<text class="hint" x="326" y="617">…64</text>
		<g id="a-ring0" class="ring-entry a" style="opacity:0">
			<rect x="60" y="592" width="40" height="40" rx="6" />

	<g id="fly2" class="token call" style="opacity:0">

		<rect x="-88" y="-14" width="176" height="28" rx="14" />

	</g>
	<g id="tokA2" class="token a" style="opacity:0">
